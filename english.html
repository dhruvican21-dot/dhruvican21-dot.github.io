<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: a practice studio — sticky tab rail, one focused panel at a time, big tap-to-hear cards */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16203A; --muted:#5A6580; --line:#DCE1EC;
  --accent:#2E55E6; --accent-soft:#E4EAFD; --signal:#F2A516; --good:#1E8A5A; --good-soft:#E2F4EA;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1424; --surface:#182036; --ink:#E8ECF6; --muted:#9AA5C0; --line:#2A3452;
  --accent:#7C9BFF; --accent-soft:#232F55; --signal:#F5B73B; --good:#4CC28A; --good-soft:#18352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1424; --surface:#182036; --ink:#E8ECF6; --muted:#9AA5C0; --line:#2A3452;
  --accent:#7C9BFF; --accent-soft:#232F55; --signal:#F5B73B; --good:#4CC28A; --good-soft:#18352A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wave{display:flex;gap:3px;align-items:center;height:34px}
.wave i{width:4px;border-radius:2px;background:var(--accent);display:block}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .92rem var(--body);color:var(--muted);background:none;border:0;padding:12px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
main .wrap{padding-block:24px 60px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.label{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:700 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:hover{border-color:var(--accent)}
.speed{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.speed button{font:600 .82rem var(--body);background:none;border:0;padding:7px 12px;color:var(--muted);cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
/* Today checklist */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.step.done{background:var(--good-soft);border-color:var(--good)}
.step input{width:22px;height:22px;margin-top:2px;accent-color:var(--good)}
.step .t{min-width:0}
.step .min{font:500 .8rem var(--mono);color:var(--muted);white-space:nowrap}
.step p{color:var(--muted);font-size:.93rem}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--good);transition:width .3s}
.streak{display:flex;gap:14px;flex-wrap:wrap}
.streak div{min-width:0}
.big{font:800 1.8rem var(--display);font-variant-numeric:tabular-nums}
/* Phrases */
.cats{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.phrases{display:flex;flex-direction:column;gap:8px}
.phrase{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.phrase .en{font-weight:700;font-size:1.02rem}
.phrase .gu{color:var(--muted);font-size:.88rem}
.phrase .t{min-width:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.phrase.mastered{border-color:var(--good)}
.tick{font:500 .75rem var(--mono);color:var(--good)}
/* Roleplay */
.client{border-left:4px solid var(--signal)}
.say{font:700 1.15rem var(--display);line-height:1.4}
.answer{background:var(--good-soft);border-radius:10px;padding:14px}
textarea,input[type=text],select{width:100%;font:1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
/* Sounds */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pair{display:flex;gap:6px;flex-wrap:wrap}
.pair button{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.pair button:hover{border-color:var(--accent)}
.tip{font-size:.92rem;color:var(--muted)}
.stress b{color:var(--accent)}
/* Plan */
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.week h3{margin-bottom:6px}
.week ul{margin:0;padding-left:18px;color:var(--muted);font-size:.93rem;display:flex;flex-direction:column;gap:4px}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.days button{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:500 .8rem var(--mono);cursor:pointer;padding:0}
.days button.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.copybox{white-space:pre-wrap;font-family:var(--body);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:.95rem}
.note{font-size:.85rem;color:var(--muted)}
/* Today session */
.dayhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.daynav{display:flex;gap:6px;align-items:center}
.daynav .big{min-width:5ch;text-align:center}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.sec.done{border-color:var(--good)}
.sec-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sec-h > div{min-width:0}
.num{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:800 1rem var(--display);display:grid;place-items:center}
.sec.done .num{background:var(--good);color:var(--surface)}
.min{font:500 .8rem var(--mono);color:var(--muted);white-space:nowrap}
.how{font-size:.93rem;color:var(--muted)}
ol.how,ul.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.part{display:flex;flex-direction:column;gap:8px}
.phrase.now{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal)}
.newp{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.newp .en{font:800 1.25rem/1.35 var(--display)}
.btn.rec{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.take{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:10px;padding:10px 12px}
.take audio{width:100%;max-width:100%}
@media (max-width:520px){.days{grid-template-columns:repeat(6,1fr)}.step{grid-template-columns:auto 1fr}.step .min{grid-column:2}.sec-h{grid-template-columns:auto 1fr}.sec-h .min{grid-column:2}}
@media (max-width:520px){header.top .wave{display:none}header.top .wrap{padding-block:16px 14px}h1{font-size:1.35rem}.sub{font-size:.88rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="top"><div class="wrap">

  <div style="min-width:0;flex:1">
    <h1>Client Call Speaking Coach</h1>
    <p class="sub">20 minutes a day. Speak clearly in US client meetings — first time, not second.</p>
  </div>
  <div class="speed" role="group" aria-label="Voice speed">
    <button type="button" id="sp-slow" aria-pressed="true">Slow</button>

<script>
(function(){
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let rate=store.get('rate',0.8);
const speaker='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Aria|Jenny|Natural/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang&&v.lang.startsWith('en'))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u)}catch(e){}}
function setRate(r){rate=r;store.set('rate',r);document.getElementById('sp-slow').setAttribute('aria-pressed',r<1);document.getElementById('sp-norm').setAttribute('aria-pressed',r>=1)}
document.getElementById('sp-slow').onclick=()=>setRate(0.8);
document.getElementById('sp-norm').onclick=()=>setRate(1);
setRate(rate);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- DATA ---------- */
const STEPS=[
 {id:'warm',min:'2 min',t:'Mouth warm-up',d:'Wake up your lips and tongue. Say everything loud and slow.'},
 {id:'shadow',min:'5 min',t:'Shadowing',d:'Listen to a line, then copy it out loud in the gap.'},
 {id:'learn',min:'3 min',t:'Your 2 new phrases',d:'Learn them by heart. Say each one 5 times.'},
 {id:'roleplay',min:'5 min',t:'Client role-play',d:'Answer 3 client questions out loud.'},
 {id:'record',min:'5 min',t:'Record yourself',d:'Speak on today\'s topic for 1–2 minutes, then listen back.'}
];
const TONGUE=['We will deliver the very first version on Wednesday.','I think the three designs are better than the old ones.','We designed, checked, and delivered the files last week.','Thank you for the feedback. We fixed the font sizes.','Very well, we will review the website this week.','This is the third draft, and I think it\'s the best one.','We changed the colors, resized the images, and updated the text.','What is the deadline for the next version?','The video was viewed by over three thousand visitors.','Both brochures were printed and shipped on Thursday.'];
const TOPICS=['Tell a new client about your company.','Explain what you did yesterday at work.','Describe your favorite project and why you like it.','Explain your design process, step by step.','Explain why a client should choose your team.','Describe a difficult client and how you handled it.','Explain the timeline of a website project.','Give a project update: what is done, what is next.','Explain why you chose certain colors for a design.','Tell a client, politely, that a change is outside the scope.','Explain a delay to a client, and give a new date.','Describe your city to a US client.','Explain how you price a project.','Ask a new client 5 questions about their project.','Present 2 design options and recommend one.','Explain what makes a good logo.','Talk about your team and who does what.','Explain the difference between print design and web design.','Thank a client and ask for a review.','Explain how revisions work in your company.','Describe your typical work day.','Explain a mistake your team made and how you will fix it.','Suggest an extra service to a happy client.','Explain why mobile design matters.','Close a call: give a summary and the next steps.','Explain which files the client will receive at the end.','Small talk: talk about one of your hobbies.','Small talk: answer "How was your weekend?"','Explain your company\'s goals for next year.','Day 30 test: Tell a new client about your company. Compare with Day 1!'];
const PHRASES={
 'Start the call':[
  ['Hi, thanks for joining today. How are you doing?','શરૂઆત — friendly hello'],
  ['Nice to meet you. I\'m Upavit, from GlobPixel.','પોતાની ઓળખ આપો'],
  ['Before we start, can you hear me clearly?','audio check'],
  ['Let me quickly walk you through the update.','update બતાવવાની શરૂઆત'],
  ['Today I want to cover three things.','agenda આપો'],
  ['Is it okay if I share my screen?','screen share પૂછો'],
  ['Good morning! Thanks for making time today.','સવારની શરૂઆત'],
  ['Okay, let\'s get started.','meeting શરૂ કરો']],
 'Explain your work':[
  ['So, the main idea here is simple.','મુખ્ય વાત કહેવી'],
  ['Here is what we did, and why we did it.','શું કર્યું અને કેમ'],
  ['We chose this color because it matches your brand.','કારણ સમજાવવું'],
  ['On the left side, you can see the new layout.','screen પર બતાવવું'],
  ['This version is cleaner and easier to read.','improvement કહેવું'],
  ['Let me show you the before and after.','comparison'],
  ['Let me explain how this works.','કામ કેવી રીતે થાય છે'],
  ['The goal of this page is to get more leads.','page નો હેતુ'],
  ['We kept it simple, so it\'s easy to use on mobile.','સરળ design નું કારણ']],
 'Ask questions':[
  ['Can you tell me a little more about your audience?','client info લેવી'],
  ['What is the main goal of this project?','goal પૂછો'],

let shOn=false,shTimer=null,shRound=0;
function utter(t){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;return u}
function shMark(i){document.querySelectorAll('#shadowlist .phrase').forEach((el,k)=>el.classList.toggle('now',k===i));const el=document.getElementById('sh-'+i);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function shStat(t){const s=document.getElementById('shadowstat');if(s)s.textContent=t}
function shButtons(){const g=document.getElementById('shadowgo'),s=document.getElementById('shadowstop');if(g){g.hidden=shOn;s.hidden=!shOn}}
function stopShadow(msg){shOn=false;clearTimeout(shTimer);try{speechSynthesis.cancel()}catch(e){}shMark(-1);shButtons();if(msg!==undefined)shStat(msg)}
function shStep(i){
 if(!shOn)return;
 const els=[...document.querySelectorAll('#shadowlist .phrase')];
 if(i>=els.length){shRound++;if(shRound<2){shStat('Round 2 starting…');shTimer=setTimeout(()=>shStep(0),1500)}else stopShadow('Finished both rounds. Great work!');return}
 const t=els[i].dataset.line,words=t.split(/\s+/).length;
 shMark(i);shStat(`Round ${shRound+1} · line ${i+1} of ${els.length} · listen…`);
 let moved=false;const next=()=>{if(moved||!shOn)return;moved=true;shStat(`Your turn — say it now`);shTimer=setTimeout(()=>shStep(i+1),Math.round(words*520/rate)+1600)};
 try{const u=utter(t);u.onend=next;u.onerror=next;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
 shTimer=setTimeout(next,Math.round(words*700/rate)+3000);
}

let mediaRec=null,chunks=[];
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('coach',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function recPut(k,b){try{const db=await idb();db.transaction('rec','readwrite').objectStore('rec').put(b,k)}catch(e){}}
async function recGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('rec').objectStore('rec').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
function addTake(d,blob){(takes[d]=takes[d]||[]).push(URL.createObjectURL(blob));recPut('rec-'+d,blob);drawTakes(d)}
async function drawTakes(d){
 const box=document.getElementById('takes');if(!box)return;
 let html=(takes[d]||[]).map((u,i)=>`<div class="take"><span class="label">Take ${i+1}</span><audio controls src="${u}"></audio></div>`).join('');
 if(!(takes[d]||[]).length){const b=await recGet('rec-'+d);if(b)html+=`<div class="take"><span class="label">Your saved recording for Day ${d}</span><audio controls src="${URL.createObjectURL(b)}"></audio></div>`}
 if(d===30){const b1=await recGet('rec-1');if(b1)html+=`<div class="take"><span class="label">Day 1 recording — compare with today</span><audio controls src="${URL.createObjectURL(b1)}"></audio></div>`}
 if(document.getElementById('takes')===box)box.innerHTML=html;
}
async function toggleRec(d){
 const btn=document.getElementById('recbtn'),st=document.getElementById('recstat');
 if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];mediaRec=new MediaRecorder(stream);
  mediaRec.ondataavailable=e=>chunks.push(e.data);
  mediaRec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());addTake(d,new Blob(chunks,{type:mediaRec.mimeType||'audio/webm'}));const b=document.getElementById('recbtn');if(b){b.classList.remove('on');b.textContent='● Record again'}const s=document.getElementById('recstat');if(s)s.textContent='Saved. Press play to listen.'};
  mediaRec.start();btn.classList.add('on');btn.textContent='■ Stop recording';st.textContent='Recording… speak now';
 }catch(e){btn.hidden=true;st.textContent='Direct recording is blocked here. Tap "Use phone recorder" — record, then it comes back here to play.'}
}

 <div class="row"><button type="button" class="btn" id="prev">← Previous</button><button type="button" class="btn" id="next">Next question →</button><button type="button" class="btn" id="rand">Random</button></div>
 <div class="panel stack"><h3>Want a live, two-way practice?</h3><p class="tip">Copy this and paste it into a new Claude chat. Claude will act as your US client and correct you after every reply.</p>
 <div class="copybox" id="rpprompt">You are a US client named Mike who owns a small business. I run a design agency. We are on a video call about a new website project. Ask me one question at a time, like a real client. After each of my answers, give me: 1) a more natural way to say it, in simple English, 2) any word that may be hard to understand. Keep your feedback short. Start the call now.</div>
 <div class="row"><button type="button" class="btn" id="copyrp">Copy prompt</button><span class="note" id="copymsg"></span></div></div>`;
}
function vSounds(){
 return `<div class="stack"><span class="label">Be understood the first time</span><h2>Clear sounds</h2>
 <p class="lead">These sounds cause most "Sorry, can you repeat?" moments. Tap a word, listen, and repeat it 3 times.</p></div>
 <div class="grid2">${PAIRS.map(p=>`<div class="panel stack"><h3>${p.t}</h3><p class="tip">${p.tip}</p>
 ${p.w.map(pr=>`<div class="pair">${pr.map((w,i)=>`<button type="button" data-say="${esc(w)}">${esc(w)}</button>${i<pr.length-1?'<span class="note" style="align-self:center">vs</span>':''}`).join('')}</div>`).join('')}</div>`).join('')}</div>
 <div class="panel stack"><h3>Word stress — say the BIG part louder</h3><p class="tip">Wrong stress is the #1 reason a correct word is not understood.</p>
 <div class="pair stress">${STRESS.map(([s,w])=>`<button type="button" data-say="${esc(w.replace(/ \(.*\)/,''))}">${esc(s).replace(/([A-Z]{2,})/g,'<b>$1</b>')}</button>`).join('')}</div></div>
 <div class="panel stack"><h3>Tongue practice sentences</h3>
 ${['We will deliver the very first version on Wednesday.','I think the three designs are better than the old ones.','We designed, checked, and delivered the files last week.','Thank you for the feedback. We fixed the font sizes.'].map(s=>`<div class="phrase"><div class="en">${s}</div><button type="button" class="icon-btn" aria-label="Listen" data-say="${esc(s)}">${speaker}</button></div>`).join('')}</div>`;
}
function vPlan(){
 return `<div class="stack"><span class="label">One month · 20 minutes a day</span><h2>30-day plan</h2>
 <p class="lead">Days fill in automatically when you finish all 5 steps on the Today page. You can also tap a day. Small daily practice beats one long session per week.</p></div>
 <div class="panel stack"><div class="row" style="justify-content:space-between"><strong>${days.length} of 30 days</strong><button type="button" class="btn" id="reset">Reset tracker</button></div>
 <div class="days">${Array.from({length:30},(_,i)=>`<button type="button" data-day="${i+1}" class="${days.includes(i+1)?'on':''}" aria-pressed="${days.includes(i+1)}" aria-label="Day ${i+1}">${i+1}</button>`).join('')}</div>
 <p class="note" id="resetmsg" hidden>Tap "Reset tracker" again to confirm.</p></div>
 <div class="weeks">${WEEKS.map(w=>`<div class="panel week"><h3>${w.t}</h3><ul>${w.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
 <div class="panel stack"><h3>Day 1 and Day 30 test</h3><p class="tip">Day 1 and Day 30 have the same recording topic: "Tell a new client about your company." Record it on the Today page. On Day 30, your Day 1 recording appears next to it. Compare: fewer stops? shorter sentences? clearer endings?</p></div>`;
}
function vPrep(){
 const p=store.get('prep',{who:'',pts:['','',''],q:''});
 return `<div class="stack"><span class="label">10 minutes before every call</span><h2>Meeting prep</h2>
 <p class="lead">Write your key points as short sentences. Then tap "Read it to me", and say each line out loud twice.</p></div>
 <div class="panel stack">
 <label class="label" for="pw">Client / project</label><input type="text" id="pw" value="${esc(p.who)}" placeholder="e.g. Mike — restaurant website">
 ${p.pts.map((v,i)=>`<label class="label" for="pp${i}">Point ${i+1} (one short sentence)</label><input type="text" id="pp${i}" value="${esc(v)}" placeholder="${['e.g. The homepage design is ready.','e.g. We changed the colors to match your logo.','e.g. The full site will be live next Friday.'][i]}">`).join('')}
 <label class="label" for="pq">My question for the client</label><input type="text" id="pq" value="${esc(p.q)}" placeholder="e.g. Who else needs to approve this?">
 <div class="row"><button type="button" class="btn primary" id="readprep">${speaker} Read it to me</button><span class="note">Saved on this device</span></div></div>
 <div class="panel stack"><h3>Your call script</h3><div class="copybox">Hi, thanks for joining today. How are you doing?
Today I want to cover three things.
First, … (point 1)
Second, … (point 2)
Third, … (point 3)
I also have one question for you: …
Great. I'll send you a short summary by email today.</div></div>
 <div class="panel stack"><h3>If the client asks you to repeat</h3><ol style="margin:0;padding-left:20px;color:var(--muted)"><li>Say "No problem."</li><li>Say it <b>slower</b>, with <b>fewer words</b>.</li><li>Still unclear? Say "Let me type it in the chat" and type it.</li></ol></div>`;
}
const VIEWS={today:vToday,phrases:vPhrases,roleplay:vRole,sounds:vSounds,plan:vPlan,prep:vPrep};
let cur=(location.hash||'').slice(1);if(!VIEWS[cur])cur=store.get('tab','today');
const view=document.getElementById('view');
function render(){
 if(shOn)stopShadow();
 if(mediaRec&&mediaRec.state==='recording')mediaRec.stop();
 view.innerHTML=VIEWS[cur]();
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===cur));
 bind();
 if(cur==='today')drawTakes(viewDay);
}
function go(t){cur=t;store.set('tab',t);render();window.scrollTo(0,0)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function bind(){
 view.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
 view.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const pr=P(viewDay),id=b.dataset.done;pr.done[id]=!pr.done[id];store.set('prog',prog);
  const all=STEPS.every(s=>pr.done[s.id]);if(all&&!days.includes(viewDay))days=[...days,viewDay];if(!all)days=days.filter(x=>x!==viewDay);store.set('days',days);render()});
 view.querySelectorAll('[data-cnt]').forEach(b=>b.onclick=()=>{const pr=P(viewDay),k=b.dataset.cnt;pr.cnt[k]=Math.min(5,(pr.cnt[k]||0)+1);store.set('prog',prog);say(k);render()});
 view.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{document.getElementById('rv-'+b.dataset.rev).hidden=false;b.hidden=true});
 const dp=document.getElementById('dprev');if(dp){dp.onclick=()=>{viewDay=Math.max(1,viewDay-1);render();window.scrollTo(0,0)};document.getElementById('dnext').onclick=()=>{viewDay=Math.min(30,viewDay+1);render();window.scrollTo(0,0)}}
 const dt=document.getElementById('dtoday');if(dt)dt.onclick=()=>{viewDay=realDay;render();window.scrollTo(0,0)};
 const sg=document.getElementById('shadowgo');if(sg){sg.onclick=()=>{shOn=true;shRound=0;shButtons();shStep(0)};document.getElementById('shadowstop').onclick=()=>stopShadow('Stopped.')}
 const rb=document.getElementById('recbtn');if(rb)rb.onclick=()=>toggleRec(viewDay);
 const rf=document.getElementById('recfile');if(rf)rf.onchange=()=>{const f=rf.files&&rf.files[0];if(f){addTake(viewDay,f);document.getElementById('recstat').textContent='Added. Press play to listen.'}rf.value=''};
 view.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;store.set('cat',cat);render()});
 view.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;if(mastered[k])delete mastered[k];else mastered[k]=1;store.set('mastered',mastered);render()});
 const pa=document.getElementById('playall');if(pa)pa.onclick=()=>{try{speechSynthesis.cancel();PHRASES[cat].forEach(([en])=>{const u=new SpeechSynthesisUtterance(en);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u);const g=new SpeechSynthesisUtterance(' ');g.volume=0;g.rate=0.3;speechSynthesis.speak(g)})}catch(e){}};
 const rv=document.getElementById('reveal');if(rv)rv.onclick=()=>{document.getElementById('ans').hidden=false};
 const nx=document.getElementById('next');if(nx){nx.onclick=()=>{rIdx=(rIdx+1)%ROLE.length;store.set('rIdx',rIdx);render()};
  document.getElementById('prev').onclick=()=>{rIdx=(rIdx-1+ROLE.length)%ROLE.length;store.set('rIdx',rIdx);render()};
  document.getElementById('rand').onclick=()=>{let n;do{n=Math.floor(Math.random()*ROLE.length)}while(n===rIdx);rIdx=n;store.set('rIdx',rIdx);render()};
  document.getElementById('copyrp').onclick=()=>{const t=document.getElementById('rpprompt').textContent;const msg=document.getElementById('copymsg');
   const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('rpprompt'));const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent='Selected — press Ctrl+C / long-press to copy'};
   try{navigator.clipboard.writeText(t).then(()=>msg.textContent='Copied',fallback)}catch(e){fallback()}}}
 view.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const d=+b.dataset.day;days=days.includes(d)?days.filter(x=>x!==d):[...days,d];store.set('days',days);render()});
 const rs=document.getElementById('reset');if(rs){let armed=false;rs.onclick=()=>{if(!armed){armed=true;document.getElementById('resetmsg').hidden=false;return}days=[];store.set('days',days);render()}}
 const rp=document.getElementById('readprep');if(rp){
  const save=()=>store.set('prep',{who:pw.value,pts:[0,1,2].map(i=>document.getElementById('pp'+i).value),q:pq.value});
  const pw=document.getElementById('pw'),pq=document.getElementById('pq');
  view.querySelectorAll('input[type=text]').forEach(i=>i.oninput=save);
  rp.onclick=()=>{const pts=[0,1,2].map(i=>document.getElementById('pp'+i).value.trim()).filter(Boolean);const w=['First','Second','Third'];
   let s='Hi, thanks for joining today. Today I want to cover '+(pts.length||'three')+' things. '+pts.map((p,i)=>w[i]+', '+p).join(' ');
   if(pq.value.trim())s+=' I also have one question for you. '+pq.value.trim();s+=' Great. I will send you a short summary by email today.';say(s)}}
}
render();
})();
</script>

</body>
</html>
